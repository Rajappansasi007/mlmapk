name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev ccache

      - name: Install Latest Buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          # Installing buildozer from git master includes fixes for modern SDK paths
          pip install --upgrade https://github.com/kivy/buildozer/archive/master.zip
          pip install "cython<3.0"

      - name: Accept Pre-installed Android SDK Licenses
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          # Accept licenses without broken pipe errors
          yes | sdkmanager --licenses || true

      - name: Build APK with Buildozer
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
        run: |
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Song-Lyrics-Manager-APK
          path: bin/*.apk
          retention-days: 14
          
